<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Funkies254</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="text-align:center;">
      <a class="auth-back" href="/pages/login.html" aria-label="Back to login">&larr;</a>
      <a class="auth-close" href="/pages/login.html" aria-label="Close">&times;</a>

      <!-- Step 1: request a reset link by email. Hidden once ?uid=&token= are present. -->
      <div id="request-step">
        <h1>Reset Password</h1>
        <form id="request-form" novalidate style="max-width:503px;margin:0 auto;">
          <div class="field">
            <label for="email" class="visually-hidden">Email</label>
            <input type="email" id="email" name="email" placeholder="Email" required autocomplete="email" />
            <span class="error-text"></span>
          </div>
          <button type="submit" class="btn btn-primary btn-sm" id="request-submit">Send Password Reset Link</button>
        </form>
        <p class="subtext" id="request-confirmation" style="display:none;margin-top:16px;">
          Please check your email for the reset link.
        </p>
      </div>

      <!-- Step 2: shown when the page is opened from the emailed link (?uid=...&token=...). -->
      <div id="confirm-step" style="display:none;">
        <h1>Choose a new password</h1>
        <form id="confirm-form" novalidate style="max-width:503px;margin:0 auto;">
          <div class="field">
            <label for="new_password" class="visually-hidden">New password</label>
            <input type="password" id="new_password" name="new_password" placeholder="New password" required minlength="8" autocomplete="new-password" />
            <span class="error-text"></span>
          </div>
          <button type="submit" class="btn btn-primary" id="confirm-submit">Reset password</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="/js/pages/reset-password.js"></script>
</body>
</html>
