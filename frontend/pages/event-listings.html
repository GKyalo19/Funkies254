<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <title>Event Listings — Funkies254</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container page-section">
    <div class="listings-banner">
      <h1 id="listings-heading">All Events</h1>
      <span id="results-count" style="color:var(--color-text-muted);font-size:14px;"></span>
    </div>

    <div class="listings-layout">
      <aside class="filter-panel">
        <h3>Filter</h3>
        <div class="filter-group">
          <h4>Section</h4>
          <div id="filter-section"></div>
        </div>
        <div class="filter-group">
          <h4>Category</h4>
          <div id="filter-category"></div>
        </div>
        <div class="filter-group" id="school-level-group">
          <h4>School level</h4>
          <div id="filter-school-level"></div>
        </div>
        <div class="filter-group">
          <h4>Format</h4>
          <div id="filter-format"></div>
        </div>
        <div class="filter-group">
          <h4>Dates</h4>
          <div id="filter-when"></div>
        </div>
        <div class="filter-group">
          <h4>Location</h4>
          <select id="filter-country"></select>
          <button type="button" class="btn btn-secondary btn-sm" id="near-me" style="margin-top:8px;">Near me</button>
        </div>
        <div class="filter-group">
          <label><input type="checkbox" id="filter-free" /> Free only</label>
        </div>
        <div class="filter-group">
          <h4>Sort</h4>
          <div id="filter-sort"></div>
        </div>
        <button class="btn btn-secondary btn-block btn-sm" id="filter-clear">Clear filters</button>
      </aside>

      <section>
        <div id="listings-grid" class="event-grid"></div>
        <div class="load-more-wrap" id="pagination-controls"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="/js/pages/event-listings.js"></script>
</body>
</html>
