<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <title>Register — Funkies254</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a class="auth-close" href="/index.html" aria-label="Close">&times;</a>
      <h1>Register</h1>
      <p class="subtext">Already have an account? <a href="/pages/login.html">Login</a></p>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name" class="visually-hidden">Full name</label>
          <input type="text" id="name" name="name" placeholder="Full name" required autocomplete="name" maxlength="150" />
          <span class="error-text"></span>
        </div>
        <div class="field">
          <label for="institution_affiliation" class="visually-hidden">School / organization</label>
          <input type="text" id="institution_affiliation" name="institution_affiliation" placeholder="School / organization (optional)" maxlength="200" autocomplete="organization" />
          <span class="error-text"></span>
        </div>
        <div class="field">
          <label for="email" class="visually-hidden">Email</label>
          <input type="email" id="email" name="email" placeholder="Email" required autocomplete="email" />
          <span class="error-text"></span>
        </div>
        <div class="field">
          <label for="password" class="visually-hidden">Password</label>
          <input type="password" id="password" name="password" placeholder="Password" required minlength="8" autocomplete="new-password" />
          <span class="error-text"></span>
        </div>
        <p class="form-hint">*Must contain alphanumeric and special characters such as */#&amp;...</p>
        <div class="field">
          <label for="password_confirm" class="visually-hidden">Confirm password</label>
          <input type="password" id="password_confirm" name="password_confirm" placeholder="Confirm password" required minlength="8" autocomplete="new-password" />
          <span class="error-text"></span>
        </div>
        <p class="form-hint">*Passwords must match</p>
        <p class="subtext" style="margin-top:var(--space-4);">
          <span style="color:var(--color-cyan);font-weight:700;font-size:20px;display:block;">Set Preferences?</span>
          After you verify your email, customize your feed to hear about events you care about
        </p>
        <button type="submit" class="btn btn-primary" id="register-submit">Register</button>
      </form>
    </div>
  </div>

  <script type="module" src="/js/pages/register.js"></script>
</body>
</html>
