<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — Funkies254</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container profile-page-wrap">
    <nav class="profile-tabs">
      <a href="/pages/profile.html" class="active">My Profile</a>
      <a href="/pages/preferences.html">Preferences</a>
      <a href="/pages/registrations.html">My Registrations</a>
    </nav>

    <section class="card-panel">
      <h1>Account Profile</h1>

      <div class="avatar-upload-row">
        <div class="avatar" id="sidebar-avatar"></div>
        <input type="file" id="avatar-input" accept="image/*" class="visually-hidden" />
        <button class="btn btn-secondary btn-sm" type="button" id="avatar-upload-btn">Change photo</button>
      </div>

      <form id="profile-form" novalidate>
        <div class="profile-field-row">
          <span class="field-label">Full name:</span>
          <input type="text" id="name" name="name" maxlength="150" />
        </div>
        <div class="profile-field-row">
          <span class="field-label">Email:</span>
          <input type="email" id="email" name="email" disabled />
        </div>
        <div class="profile-field-row">
          <span class="field-label">Role:</span>
          <input type="text" id="role" disabled />
        </div>
        <div class="profile-field-row">
          <span class="field-label">School / organization:</span>
          <input type="text" id="institution_affiliation" name="institution_affiliation" maxlength="200" />
        </div>
        <div class="profile-field-row">
          <span class="field-label">Linked institution:</span>
          <input type="text" id="institution" disabled />
        </div>
        <p class="form-hint">Your school name is what you typed at signup. A linked institution is only set when an administrator promotes you to staff.</p>

        <div class="form-actions">
          <button type="submit" class="btn btn-gold" id="save-btn">Save Changes</button>
          <button type="button" class="btn btn-secondary" id="discard-btn">Discard Changes</button>
        </div>
      </form>

      <a href="/pages/preferences.html" class="manage-prefs-link">Manage preferences?</a>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="/js/pages/profile.js"></script>
</body>
</html>
