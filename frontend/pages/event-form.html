<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Event — Funkies254</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container page-section" style="max-width:720px;">
    <!-- Hidden until we know the visitor is staff/admin, so students don't see a flash of the form. -->
    <div id="event-form-page" hidden>
    <h1>Add Event</h1>
    <p>Staff-only tool for curating new events. (You can also use the Django admin for bulk edits.)</p>

    <div class="card-panel">
      <form id="event-form" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required />
          <span class="error-text"></span>
        </div>
        <div class="field">
          <label for="institution_id">Institution</label>
          <select id="institution_id" name="institution_id" required></select>
          <span class="error-text"></span>
        </div>
        <div class="field">
          <label>Categories</label>
          <div class="tag-select" id="categories-field"></div>
          <span class="error-text"></span>
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4" required></textarea>
          <span class="error-text"></span>
        </div>
        <div class="field">
          <label for="school_level_id">School level</label>
          <select id="school_level_id" name="school_level_id">
            <option value="">Any level</option>
          </select>
          <span class="error-text"></span>
        </div>
        <div class="field">
          <label><input type="checkbox" id="is_virtual" name="is_virtual" style="width:auto;display:inline;margin-right:8px;" />This is a virtual event</label>
        </div>
        <div id="physical-fields">
          <div class="field">
            <label for="venue">Venue</label>
            <input type="text" id="venue" name="venue" />
            <span class="error-text"></span>
          </div>
          <div class="field">
            <label for="location">Location (city/region)</label>
            <input type="text" id="location" name="location" />
            <span class="error-text"></span>
          </div>
        </div>
        <div class="field">
          <label for="registration_link">Registration / joining link <span id="link-required-hint" style="display:none;">(required for virtual events)</span></label>
          <input type="url" id="registration_link" name="registration_link" placeholder="https://..." />
          <span class="error-text"></span>
        </div>
        <div class="field">
          <label for="start_time">Start date &amp; time</label>
          <input type="datetime-local" id="start_time" name="start_time" required />
          <span class="error-text"></span>
        </div>
        <div class="field">
          <label for="end_time">End date &amp; time</label>
          <input type="datetime-local" id="end_time" name="end_time" required />
          <span class="error-text"></span>
        </div>
        <div class="field">
          <label for="cover_image">Cover image (optional)</label>
          <input type="file" id="cover_image" name="cover_image" accept="image/jpeg,image/png,image/webp" />
          <span class="error-text"></span>
        </div>

        <p class="form-hint">New events start unverified and stay hidden from students until an administrator verifies them.</p>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Create Event</button>
        </div>
      </form>
    </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="/js/pages/event-form.js"></script>
</body>
</html>
