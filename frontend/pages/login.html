<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <title>Log In — Funkies254</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a class="auth-close" href="/index.html" aria-label="Close">&times;</a>
      <h1>Log In</h1>
      <p class="subtext">Don&rsquo;t have an account yet? <a href="/pages/register.html">Register</a></p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email" class="visually-hidden">Email</label>
          <input type="email" id="email" name="email" placeholder="Email" required autocomplete="email" />
          <span class="error-text"></span>
        </div>
        <div class="field">
          <label for="password" class="visually-hidden">Password</label>
          <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password" />
          <span class="error-text"></span>
        </div>
        <div class="auth-links">
          <span></span>
          <a href="/pages/reset-password.html">Forgot password? Reset</a>
        </div>
        <button type="submit" class="btn btn-primary" id="login-submit">Login</button>
      </form>
    </div>
  </div>

  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
