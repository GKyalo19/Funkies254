<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <title>Verify email — Funkies254</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a class="auth-close" href="/index.html" aria-label="Close">&times;</a>
      <h1>Verify your email</h1>
      <p class="subtext" id="verify-copy">Enter the 6-digit code we sent you.</p>

      <form id="verify-form" novalidate>
        <div class="field">
          <label for="email" class="visually-hidden">Email</label>
          <input type="email" id="email" name="email" placeholder="Email" required autocomplete="email" />
          <span class="error-text"></span>
        </div>
        <div class="field">
          <label for="code" class="visually-hidden">Verification code</label>
          <input
            type="text"
            id="code"
            name="code"
            class="code-input"
            placeholder="000000"
            required
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            pattern="[0-9]{6}"
          />
          <span class="error-text"></span>
        </div>
        <button type="submit" class="btn btn-primary" id="verify-submit">Verify</button>
      </form>

      <p class="subtext" style="margin-top: var(--space-5);">
        Didn’t get a code?
        <button type="button" class="text-link" id="resend-btn">Resend code</button>
      </p>
    </div>
  </div>

  <script type="module" src="/js/pages/verify-email.js"></script>
</body>
</html>
