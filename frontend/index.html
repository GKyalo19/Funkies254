<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <title>Funkies254 — Student Events in Kenya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="hero container">
      <h1>Funkies 254</h1>
      <p class="tagline">&ldquo;Know all about the events happening all around&rdquo;</p>
      <form class="hero-search" id="hero-search-form">
        <div class="search-bar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" name="q" placeholder="Search events" />
        </div>
      </form>
      <div class="hero-actions" id="hero-actions"></div>
    </section>

    <section class="page-section container">
      <div class="section-heading">
        <h2 id="popular-heading">Popular Events</h2>
      </div>
      <div id="popular-row" class="event-row"></div>
    </section>

    <div id="home-sections"></div>

    <section class="page-section container">
      <a href="/pages/event-listings.html" class="btn btn-secondary">Browse all events</a>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="/js/pages/home.js"></script>
</body>
</html>
