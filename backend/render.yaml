# Render "Blueprint" — lets you deploy by clicking "New +" -> "Blueprint" and
# pointing Render at this repo, instead of configuring a web service by hand.
# (Manual setup instructions are in docs/DEPLOYMENT.md.)
services:
  - type: web
    name: funkies254-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.9"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: JWT_COOKIE_SECURE
        value: "True"
      # Netlify -> Render is cross-site, so the cookies must be SameSite=None.
      - key: JWT_COOKIE_SAMESITE
        value: "None"
      - key: JWT_COOKIE_CSRF_ENFORCED
        value: "True"
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: SUPABASE_BUCKET_EVENT_COVERS
        value: "event-covers"
      - key: SUPABASE_BUCKET_AVATARS
        value: "avatars"
      # The rest (DATABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
      # CORS_ALLOWED_ORIGINS, CSRF_TRUSTED_ORIGINS, FRONTEND_BASE_URL) must be
      # set in the Render dashboard — they are secrets or deployment-specific.
