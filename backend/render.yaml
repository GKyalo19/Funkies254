# Render "Blueprint" — lets you deploy by clicking "New +" -> "Blueprint" and
# pointing Render at this repo, instead of configuring a web service by hand.
# (Manual setup instructions, if you'd rather not use a Blueprint, are in
# docs/DEPLOYMENT.md.)
services:
  - type: web
    name: funkies254-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.9"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: JWT_COOKIE_SECURE
        value: "True"
      # The rest (DATABASE_URL, SUPABASE_*, CORS_ALLOWED_ORIGINS, FRONTEND_BASE_URL,
      # EMAIL_*) must be set manually in the Render dashboard — they contain secrets
      # or deployment-specific values that don't belong in version control.
